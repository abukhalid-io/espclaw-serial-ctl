<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>ESP-Claw Control</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scan-view" class="view">
    <div class="scan-wrap">
      <div class="logo">🦞 ESP-Claw</div>
      <div class="subtitle">Cari dan hubungkan device kamu</div>
      <div class="spinner" id="spinner"></div>
      <div class="status" id="scan-status">Mencari device di USB...</div>
      <div class="card port-card">
        <table class="port-table">
          <thead><tr><th>PORT</th><th>VID:PID</th><th>DESKRIPSI</th></tr></thead>
          <tbody id="port-list"></tbody>
        </table>
      </div>
      <div class="btn-row">
        <button id="connect-btn" class="btn btn-primary" disabled onclick="connectSelected()">Hubungkan</button>
        <button class="btn btn-outline" onclick="startScanning()">Scan Ulang</button>
      </div>
      <div class="error" id="scan-error"></div>
    </div>
  </div>

  <div id="dashboard-view" class="view" style="display:none">
    <div class="dash-wrap">
      <div class="card hero">
        <div class="hero-left">
          <div class="logo small">🦞 ESP-Claw</div>
          <div class="status-row">
            <span class="dot dot-green"></span>
            <span id="dash-subtitle" class="dim"></span>
          </div>
        </div>
        <button class="btn btn-outline" onclick="disconnectClicked()">Putuskan</button>
      </div>

      <div class="stats-row">
        <div class="card stat">
          <div class="stat-label">📶 WIFI</div>
          <div class="stat-value" id="wifi-value">—</div>
        </div>
        <div class="card stat">
          <div class="stat-label">🔌 SERIAL LINK</div>
          <div class="stat-value" id="link-value">—</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-console" onclick="showTab('console')">Console</button>
        <button class="tab" id="tab-web" onclick="showTab('web')">Tampilan Web</button>
      </div>

      <div id="panel-console" class="panel">
        <div class="quick-row">
          <button class="btn btn-soft" onclick="quick('help')">Help</button>
          <button class="btn btn-soft" onclick="quick('wifi --status')">WiFi Status</button>
          <button class="btn btn-soft" onclick="quick('wifi --scan')">WiFi Scan</button>
          <button class="btn btn-soft" onclick="quick(null)">Reset</button>
        </div>
        <div class="card console-card">
          <pre id="console-output"></pre>
        </div>
        <div class="input-row">
          <div class="card input-card">
            <input id="cmd-input" type="text" placeholder="Ketik command..." onkeydown="if(event.key==='Enter') sendClicked()" />
          </div>
          <button class="btn btn-primary" onclick="sendClicked()">Kirim</button>
        </div>
      </div>

      <div id="panel-web" class="panel" style="display:none">
        <div class="input-row">
          <div class="card input-card">
            <input id="web-url-input" type="text" value="192.168.4.1" placeholder="IP device..." />
          </div>
          <button class="btn btn-soft" onclick="loadWebUi()">Muat</button>
          <button class="btn btn-outline" onclick="openWebWindow()">Buka di Window Baru</button>
        </div>
        <div class="card iframe-card">
          <iframe id="web-frame" src="about:blank"></iframe>
        </div>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
