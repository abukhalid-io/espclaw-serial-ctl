[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "espclaw-serial-ctl"
version = "0.1.0"
description = "Kontrol ESP-Claw (ESP32-S3) via USB serial console dari komputer manapun"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
gui = ["pywebview>=6.0"]

[project.scripts]
espclawctl = "espclaw_ctl.cli:main"

[project.gui-scripts]
espclawctl-gui = "espclaw_ctl.gui:main"

[tool.setuptools]
packages = ["espclaw_ctl"]
include-package-data = true

[tool.setuptools.package-data]
"espclaw_ctl" = ["webapp/*.html", "webapp/*.css", "webapp/*.js"]
