[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "espclaw-serial-ctl"
version = "0.1.0"
description = "Control ESP-Claw (ESP32-S3) over its USB serial console from any computer"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "Pillow>=10.0",
]

[project.scripts]
espclawctl = "espclaw_ctl.cli:main"

[project.gui-scripts]
espclawctl-gui = "espclaw_ctl.gui:main"

[tool.setuptools]
packages = ["espclaw_ctl", "espclaw_ctl.gui"]

[tool.setuptools.package-data]
"espclaw_ctl.gui" = ["assets/*.png"]
